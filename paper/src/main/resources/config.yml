metrics:
  bstats: true

models:
  namespace: "modelengine"
  join-send-delay: 500 # ms
  spawn-send-delay: 50 # ms
  properties-send-delay: 30 # ms
  custom-entity-sync-delay: 150
  custom-entity-sync-resend-interval: 40
  custom-entity-sync-resend-count: 3
  entity-position-update-period: 35 # ms
  thread-pool-size: 4
  # BetterModel: send bone visibility bits. Only for packs whose models were exported with part
  # visibility on (config.json "disable_part_visibility": false); the extension registers no
  # bone properties otherwise.
  part-visibility: false

options:
  debug:
    spawn: false
    animations: false
    send-data: false
    location: false
    death: false
  hooks:
    floodgate: true # Recommended method