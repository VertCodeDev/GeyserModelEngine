main: re.imc.geysermodelengine.GeyserModelEngine
name: GeyserModelEngine
version: '${version}'
api-version: '1.21'

folia-supported: true

authors:
  - zimzaza4
  - willem.dev
  - xSquishyLiam


dependencies:
  server:
    GeyserUtils:
      required: true
      load: BEFORE
      join-classpath: true
    # The server's packetevents plugin, loaded and started before this one.
    packetevents:
      required: true
      load: BEFORE
      join-classpath: true
    floodgate:
      required: false
    ModelEngine:
      required: false
    BetterModel:
      required: false